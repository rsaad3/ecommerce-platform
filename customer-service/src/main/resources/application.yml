
server:
  port: 8081

spring:
  application:
    name: customer-service
  profiles:
    active: local

  app:
    environment: local

  datasource:
    url: jdbc:postgresql://localhost:5432/customer_db
    username: postgres
    password: Ted@0100

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  logstash:
    destination: ${LOGSTASH_DESTINATION:localhost:5000}

  level:
    root: INFO
    com.ecommerce.customer: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
