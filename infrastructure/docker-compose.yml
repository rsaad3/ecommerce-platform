
services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce123
      POSTGRES_DB: ecommerce_admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - ecommerce-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Kafka - KRaft
  # =========================
  kafka:
    image: apache/kafka:3.9.1
    container_name: ecommerce-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - ecommerce-network

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 10s
      timeout: 10s
      retries: 10

  # =========================
  # Elasticsearch
  # =========================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ecommerce-elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    networks:
      - ecommerce-network

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 20

  # =========================
  # Logstash
  # =========================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: ecommerce-logstash

    ports:
      - "5000:5000"

    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - ecommerce-network

  # =========================
  # Kibana
  # =========================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: ecommerce-kibana

    ports:
      - "5601:5601"
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - ecommerce-network

# =========================
# Networks
# =========================
networks:
  ecommerce-network:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  postgres_data:
  kafka_data:
  elasticsearch_data:
